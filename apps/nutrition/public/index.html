<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chamber · Nutrition</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --panel-2: #1e222b;
      --border: #2a2f3a;
      --text: #e6e8ec;
      --muted: #8b93a1;
      --accent: #6ea8fe;
      --macro: #6ea8fe;
      --micro: #7ee0b8;
      --danger: #ff7a7a;
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      padding: 28px 24px 12px;
      max-width: 880px;
      margin: 0 auto;
    }
    h1 { margin: 0; font-size: 22px; letter-spacing: .2px; }
    .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
    main { max-width: 880px; margin: 0 auto; padding: 12px 24px 60px; }

    .toolbar { display: flex; gap: 10px; align-items: center; margin: 16px 0; }
    button {
      font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--border);
      background: var(--panel-2); color: var(--text); padding: 8px 14px;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #07101f; font-weight: 600; }
    button:hover { filter: brightness(1.1); }
    button:disabled { opacity: .5; cursor: default; }

    .meals { display: flex; flex-direction: column; gap: 10px; }
    .meal {
      background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
      overflow: hidden;
    }
    .meal-head {
      display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer;
      user-select: none;
    }
    .meal-head:hover { background: var(--panel-2); }
    .meal-name { font-weight: 600; }
    .meal-time { color: var(--muted); font-size: 13px; }
    .spacer { flex: 1; }
    .chev { color: var(--muted); transition: transform .15s ease; }
    .meal.open .chev { transform: rotate(90deg); }

    .meal-body { padding: 0 16px 16px; display: none; }
    .meal.open .meal-body { display: block; }

    .nut-group-label {
      font-size: 11px; text-transform: uppercase; letter-spacing: .8px;
      color: var(--muted); margin: 10px 0 6px;
    }
    table { width: 100%; border-collapse: collapse; }
    td { padding: 6px 0; border-bottom: 1px solid var(--border); }
    td.val { text-align: right; font-variant-numeric: tabular-nums; }
    .pill { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; vertical-align: middle; }
    .pill.macro { background: var(--macro); }
    .pill.micro { background: var(--micro); }

    .empty, .loading { color: var(--muted); padding: 24px 0; text-align: center; }
    .empty strong { color: var(--text); }
    .err { color: var(--danger); padding: 10px 0; }

    .fetch-row { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
    .fetch-status { font-size: 12px; color: var(--muted); }
    .fetch-status.err-text { color: var(--danger); }

    /* form */
    dialog {
      border: 1px solid var(--border); background: var(--panel); color: var(--text);
      border-radius: var(--radius); padding: 0; width: min(480px, 92vw);
    }
    dialog::backdrop { background: rgba(0,0,0,.55); }
    .form-inner { padding: 20px; }
    .form-inner h2 { margin: 0 0 14px; font-size: 17px; }
    label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
    input, textarea {
      width: 100%; font: inherit; padding: 9px 10px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    }
    textarea { resize: vertical; min-height: 64px; }
    .comp-row { display: flex; gap: 8px; margin-top: 8px; }
    .comp-row input.cname { flex: 1; }
    .comp-row input.cqty { width: 96px; }
    .comp-row button { padding: 8px 10px; }
    .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  </style>
</head>
<body>
  <header>
    <h1>Nutrition</h1>
    <div class="sub">Chamber · meals served from <code>:8080</code> gold view</div>
  </header>
  <main>
    <div class="toolbar">
      <button class="primary" id="logBtn">+ Log a meal</button>
      <button id="refreshBtn">Refresh</button>
      <span class="spacer"></span>
      <span class="sub" id="count"></span>
    </div>
    <div id="error" class="err" hidden></div>
    <div id="meals" class="meals"><div class="loading">Loading meals…</div></div>
  </main>

  <dialog id="logDialog">
    <form method="dialog" class="form-inner" id="logForm">
      <h2>Log a meal</h2>
      <label for="mealDesc">What did you eat?</label>
      <textarea id="mealDesc" name="description" rows="3" placeholder="sausage egg and cheese everything bagel" required></textarea>
      <div class="hint">Describe your meal in plain language. The components and their portions are estimated automatically, then nutrition is looked up for each.</div>
      <div class="form-actions">
        <button type="button" id="cancelBtn">Cancel</button>
        <button type="submit" class="primary" id="saveBtn">Log meal</button>
      </div>
    </form>
  </dialog>

  <script>
    // ── tiny API client (unwraps the { result } envelope) ─────────────────
    async function call(op, body = {}) {
      const r = await fetch("/" + op, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
      return data.result;
    }

    const fmtTime = (ms) =>
      new Date(ms).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
    const round = (n) => (Math.round(n * 10) / 10).toLocaleString();

    const el = (id) => document.getElementById(id);
    const mealsEl = el("meals");
    const errEl = el("error");

    function showError(msg) {
      errEl.textContent = msg;
      errEl.hidden = false;
    }
    function clearError() { errEl.hidden = true; }

    // ── render the meal list ──────────────────────────────────────────────
    async function loadMeals() {
      clearError();
      mealsEl.innerHTML = '<div class="loading">Loading meals…</div>';
      let meals;
      try {
        meals = await call("list_meals");
      } catch (e) {
        mealsEl.innerHTML = "";
        showError("Could not load meals: " + e.message);
        return;
      }
      el("count").textContent = meals.length ? `${meals.length} meal${meals.length === 1 ? "" : "s"}` : "";
      if (!meals.length) {
        mealsEl.innerHTML = '<div class="empty">No meals logged yet. Click “+ Log a meal”.</div>';
        return;
      }
      mealsEl.innerHTML = "";
      for (const m of meals) mealsEl.appendChild(mealCard(m));
    }

    function mealCard(m) {
      const card = document.createElement("div");
      card.className = "meal";
      card.innerHTML = `
        <div class="meal-head">
          <span class="meal-name"></span>
          <span class="spacer"></span>
          <span class="meal-time"></span>
          <span class="chev">›</span>
        </div>
        <div class="meal-body"><div class="loading">Loading nutrition…</div></div>`;
      card.querySelector(".meal-name").textContent = m.name;
      card.querySelector(".meal-time").textContent = fmtTime(m.eaten_at);
      const body = card.querySelector(".meal-body");
      let loaded = false;

      // Render this meal's nutrition into the body. log_meal resolves nutrition end-to-end at
      // log time (estimate components → look up each), so there's no separate fetch step.
      async function renderNutrition() {
        try {
          const rows = await call("nutrition_for", { meal_id: m.id });
          body.innerHTML = "";
          body.appendChild(nutritionTable(rows));
        } catch (e) {
          loaded = false;
          body.innerHTML = `<div class="err">${e.message}</div>`;
        }
      }

      card.querySelector(".meal-head").addEventListener("click", async () => {
        card.classList.toggle("open");
        if (loaded || !card.classList.contains("open")) return;
        loaded = true;
        await renderNutrition();
      });
      return card;
    }

    function nutritionTable(rows) {
      const frag = document.createDocumentFragment();
      if (!rows.length) {
        const d = document.createElement("div");
        d.className = "empty";
        d.innerHTML =
          "No nutrient data for this meal — its components couldn’t be resolved to any nutrition source.";
        frag.appendChild(d);
        return frag;
      }
      for (const kind of ["macro", "micro"]) {
        const group = rows.filter((r) => r.nutrient_kind === kind);
        if (!group.length) continue;
        const label = document.createElement("div");
        label.className = "nut-group-label";
        label.textContent = kind === "macro" ? "Macronutrients" : "Micronutrients";
        frag.appendChild(label);
        const table = document.createElement("table");
        for (const r of group) {
          const tr = document.createElement("tr");
          const name = document.createElement("td");
          name.innerHTML = `<span class="pill ${kind}"></span>`;
          name.append(r.nutrient);
          const val = document.createElement("td");
          val.className = "val";
          val.textContent = `${round(r.amount)} ${r.unit}`;
          tr.append(name, val);
          table.appendChild(tr);
        }
        frag.appendChild(table);
      }
      return frag;
    }

    // ── log-meal dialog ───────────────────────────────────────────────────
    const dialog = el("logDialog");

    el("logBtn").addEventListener("click", () => {
      el("mealDesc").value = "";
      dialog.showModal();
    });
    el("cancelBtn").addEventListener("click", () => dialog.close());

    el("logForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const description = el("mealDesc").value.trim();
      if (!description) {
        showError("Describe what you ate.");
        return;
      }
      const saveBtn = el("saveBtn");
      saveBtn.disabled = true;
      saveBtn.textContent = "Estimating…";
      try {
        await call("log_meal", { description });
        dialog.close();
        await loadMeals();
      } catch (err) {
        showError("Could not log meal: " + err.message);
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = "Log meal";
      }
    });

    el("refreshBtn").addEventListener("click", loadMeals);
    loadMeals();
  </script>
</body>
</html>
