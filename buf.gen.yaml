# Generates TypeScript message types + descriptors from the datagram protos.
# Uses the LOCAL protoc-gen-es plugin (npm @bufbuild/protoc-gen-es on PATH via
# node_modules/.bin) so codegen needs no network — important on a fresh box.
#   npm i -D @bufbuild/protoc-gen-es   then:   buf generate
version: v2
plugins:
  - local: protoc-gen-es
    out: packages/datagram/gen
    opt:
      - target=ts
      - json_types=true
