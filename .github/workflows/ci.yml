name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate code from protos (buf)
        run: npm run gen

      - name: Fail if generated code is out of date
        run: git diff --exit-code -- '**/gen' || (echo "::error::Generated code is stale — run 'npm run gen' and commit." && exit 1)

      - name: Lint protos
        run: npm run lint:proto

      - name: Lint & format check
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
